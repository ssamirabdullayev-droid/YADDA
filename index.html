<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>YADDA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
.app{max-width:480px;margin:auto;min-height:100vh;padding:22px 18px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 20px}.logo{font-size:31px;font-weight:800;letter-spacing:-1.2px}.sub{color:#777;font-size:13px}.gear{border:0;background:#fff;border-radius:50%;width:44px;height:44px;font-size:19px;box-shadow:0 3px 15px #0001}
.hero{background:#111;color:#fff;border-radius:25px;padding:22px 18px 18px;box-shadow:0 12px 30px #0002}.hero h1{font-size:22px;margin:0 0 8px}.hero p{margin:0 0 16px;color:#c9c9c9;line-height:1.35}.box{display:flex;background:#fff;border-radius:17px;padding:7px}.box textarea{flex:1;border:0;outline:0;resize:none;font:16px Arial;padding:10px;min-height:48px}.save{border:0;border-radius:13px;background:#111;color:#fff;padding:0 13px;font-weight:700}
.section{font-size:18px;font-weight:750;margin:24px 2px 12px}.memory{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0000000b}.tag{display:inline-block;background:#eeeef1;border-radius:20px;padding:5px 10px;font-size:12px;color:#555;margin-bottom:9px}.memory p{margin:0;font-size:15px;line-height:1.4}.time{font-size:11px;color:#999;margin-top:9px}
.chat{background:#fff;border-radius:20px;padding:14px;margin-top:16px;box-shadow:0 2px 12px #0000000b}.chat-title{font-weight:750;margin-bottom:10px}.messages{max-height:310px;overflow:auto}.msg{padding:10px 12px;border-radius:14px;margin:7px 0;font-size:14px;line-height:1.4}.user{background:#111;color:#fff;margin-left:35px}.bot{background:#f0f0f2;margin-right:25px}.chatbox{display:flex;gap:7px;margin-top:10px}.chatbox input{flex:1;border:1px solid #ddd;border-radius:13px;padding:11px;outline:0;font-size:14px}.send{border:0;background:#111;color:#fff;border-radius:13px;padding:0 15px;font-weight:700}
.navwrap{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;backdrop-filter:blur(16px);border-top:1px solid #ddd}.nav{max-width:480px;margin:auto;display:flex;justify-content:space-around;padding:9px 10px calc(9px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#777;font-size:12px}.nav b{display:block;font-size:21px;margin-bottom:2px}.active{color:#111!important}.empty{color:#999;text-align:center;padding:20px}
.toast{position:fixed;left:20px;right:20px;bottom:88px;background:#111;color:#fff;text-align:center;padding:13px;border-radius:14px;display:none}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><div class="logo">YADDA</div><div class="sub">Sənin şəxsi AI yaddaşın</div></div><button class="gear" onclick="alert('YADDA: yaddaşlar bu cihazın brauzerində saxlanılır.')">⚙️</button></div>

<div class="hero">
<h1>Nəyi yadda saxlayım?</h1>
<p>Yaz, YADDA yaddaşını təşkil etsin.</p>
<div class="box"><textarea id="note" placeholder="Məs: Sabah saat 10-da banka zəng etməliyəm"></textarea><button class="save" onclick="save()">Yadda saxla</button></div>
</div>

<div class="chat">
<div class="chat-title">🧠 YADDA köməkçisi</div>
<div id="messages" class="messages">
<div class="msg bot">Salam! Yaddaşların haqqında mənə sual ver. Məsələn: “Sabah nə etməliyəm?”</div>
</div>
<div class="chatbox">
<input id="question" placeholder="Məs: Sabah nə etməliyəm?" onkeydown="if(event.key==='Enter')ask()">
<button class="send" onclick="ask()">Göndər</button>
</div>
</div>

<div class="section">Son yaddaşlar</div>
<div id="list"></div>
</div>

<div class="navwrap"><div class="nav">
<button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><b>⌂</b>Ana səhifə</button>
<button onclick="document.getElementById('note').focus()"><b>＋</b>Əlavə et</button>
<button onclick="document.getElementById('question').focus()"><b>🧠</b>AI</button>
</div></div>

<div id="toast" class="toast">Yadda saxlanıldı ✓</div>

<script>
function esc(s){return s.replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
function cat(t){let x=t.toLowerCase();if(/sabah|saat|zəng|zeng|xatırlat|xatirlat|görüş|gorus|sonra/.test(x))return'Xatırlatma';if(/ideya|fikir|layihə|layihe|startup|biznes/.test(x))return'İdeya';if(/plan|getmək|getmek|etməli|etmeli|hazırla|hazirla|səfər|sefer/.test(x))return'Plan';return'Qeyd'}
function memories(){return JSON.parse(localStorage.getItem('yadda')||'[]')}
function render(){let a=memories(),l=document.getElementById('list');if(!a.length){l.innerHTML='<div class="empty">Hələ yaddaş yoxdur.</div>';return}l.innerHTML=a.map(x=>`<div class="memory"><span class="tag">${esc(x.cat)}</span><p>${esc(x.text)}</p><div class="time">${esc(x.time)}</div></div>`).join('')}
function save(){let e=document.getElementById('note'),t=e.value.trim();if(!t)return;let a=memories();a.unshift({text:t,cat:cat(t),time:'İndi'});localStorage.setItem('yadda',JSON.stringify(a));e.value='';render();let q=document.getElementById('toast');q.style.display='block';setTimeout(()=>q.style.display='none',1400)}
function addMsg(text,type){let m=document.getElementById('messages');let d=document.createElement('div');d.className='msg '+type;d.textContent=text;m.appendChild(d);m.scrollTop=m.scrollHeight}
function answer(q){
let a=memories(),x=q.toLowerCase();
if(!a.length)return'Yaddaşında hələ məlumat yoxdur. Əvvəlcə bir neçə məlumat yadda saxla.';
let found;
if(/sabah|nə etməli|ne etmeli|tapşır|tapsiriq/.test(x)) found=a.filter(m=>m.cat.includes('Xatırlatma')||/etməli|etmeli|saat|zəng|zeng/.test(m.text.toLowerCase()));
else if(/ideya|fikir|biznes|startup|layihə|layihe/.test(x)) found=a.filter(m=>m.cat.includes('İdeya'));
else if(/plan|səfər|sefer|getmək|getmek|hara/.test(x)) found=a.filter(m=>m.cat.includes('Plan'));
else found=a.filter(m=>m.text.toLowerCase().includes(x));
if(!found.length)return'Bu sualla bağlı yaddaşımda məlumat tapmadım.';
return'Mənim yaddaşımda bunlar var:\\n\\n'+found.slice(0,5).map(m=>'• '+m.text).join('\\n');
}
function ask(){let e=document.getElementById('question'),q=e.value.trim();if(!q)return;addMsg(q,'user');e.value='';setTimeout(()=>addMsg(answer(q),'bot'),250)}
render();
</script>
</body>
</html>
